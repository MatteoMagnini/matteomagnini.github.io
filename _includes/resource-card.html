<article class="resource-card">

  <div class="resource-card-header">
    <div class="resource-card-header-main">

      <h3 class="resource-card-title">
        {{ post.title }}
      </h3>

      {% if post.type %}
        <span class="resource-card-type-pill">
          {{ post.type }}
        </span>
      {% endif %}

    </div>
  </div>

  {% if post.description %}
    <div class="resource-card-body">
      <p class="resource-card-description">
        {{ post.description }}
      </p>
    </div>
  {% endif %}

  {% if post.resource_url %}
    <div class="resource-card-footer">
      <a href="{{ post.resource_url }}" class="resource-card-link">
        Read resource →
      </a>
    </div>
  {% endif %}

</article>
